name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Run regression tests and packaged MCP launch
        run: uv run --python 3.11 --with mcp==2.3.0 --with pillow==12.3.0 python -m unittest discover -s tests -v
